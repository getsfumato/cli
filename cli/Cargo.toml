[package]
name = "sfumato"
description = "Generate Obsidian-friendly learning resources with local or cloud models"
keywords = ["sfumato", "slides", "marp", "obsidian", "learning"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
indicatif = "0.18"
inquire = "0.7"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
serde_json = "1.0"
sfumato-core.workspace = true
sfumato-adapters.workspace = true
sfumato-domain.workspace = true
tachyonfx = "0.25.1"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tui-widgets = { version = "0.7.10", default-features = false, features = ["big-text", "scrollbar"] }

[dev-dependencies]
tempfile = "3.23"
