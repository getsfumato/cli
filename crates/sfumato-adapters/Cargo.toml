[package]
name = "sfumato-adapters"
version = "0.2.0"
edition = "2024"

[features]
real-renderers = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
comrak = { version = "0.54", default-features = false }
dirs = "6.0"
fs2 = "0.4"
html5ever = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
include_dir = "0.7"
keyring = "4.1"
lightningcss = "1.0.0-alpha.70"
markup5ever_rcdom = "0.36"
minijinja = { version = "2.12", features = ["loader"] }
oxc_allocator = "0.75"
oxc_parser = "0.75"
oxc_span = "0.75"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sfumato-core = { path = "../sfumato-core" }
tempfile = "3.23"
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "sync", "time"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt"] }
