[package]
name = "sfumato-adapters"
description = "Filesystem, HTTP, prompt, renderer and store adapters for Sfumato"
keywords = ["sfumato", "slides", "adapters", "renderers"]
categories = ["text-processing", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# `assets/` is compiled in, not read at runtime: `include_dir!` for the prompt
# tree and a dozen `include_str!`/`include_bytes!` for themes, runtimes and
# manifests. Excluding it would publish a crate that still compiles — an absent
# `include_dir!` directory yields an empty Dir rather than an error — and then
# ships with no prompts at all, so CI counts the packaged files instead of
# trusting the compiler.
#
# `tests/` stays because src modules pull their tests in with
# `#[cfg(test)] #[path = "../../tests/unit/..."]`; without it the published crate
# cannot be tested, which is the only real check that packaging worked.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "assets/**",
    "Cargo.toml",
    "README.md",
]

[features]
# Opt-in, and it must stay that way: it gates tests that execute real Marp,
# Mermaid, ffmpeg, curl and browser binaries.
real-renderers = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
comrak = { version = "0.54", default-features = false }
dirs = "6.0"
fs2 = "0.4"
html5ever = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
include_dir = "0.7"
keyring = "4.1"
lightningcss = "1.0.0-alpha.70"
markup5ever_rcdom = "0.36"
minijinja = { version = "2.12", features = ["loader"] }
oxc_allocator = "0.75"
oxc_parser = "0.75"
oxc_span = "0.75"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
slug = "0.1"
sfumato-core.workspace = true
tempfile = "3.23"
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "sync", "time"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt"] }
