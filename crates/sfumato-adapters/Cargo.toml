[package]
name = "sfumato-adapters"
version = "0.2.0"
edition = "2024"

[features]
real-renderers = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
dirs = "6.0"
fs2 = "0.4"
include_dir = "0.7"
minijinja = { version = "2.12", features = ["loader"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sfumato-core = { path = "../sfumato-core" }
sfumato-domain = { path = "../sfumato-domain" }
tempfile = "3.23"
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1.48", features = ["macros", "process", "time"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt"] }
