[package]
name = "sfumato-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
dirs = "6.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slug = "0.1"
thiserror = "2.0"
tokio = { version = "1.48", features = ["process"] }
toml = "0.9"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"
