[package]
name = "sfumato-core"
description = "Workflows, ports and application facade for Sfumato"
keywords = ["sfumato", "slides", "generation", "workflows"]
categories = ["text-processing", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Opt-in, and it must stay that way: it gates tests that execute real Marp,
# Mermaid, ffmpeg and browser binaries. Used by this crate's own manim tests.
real-renderers = []

[dependencies]
async-trait = "0.1"
json-patch = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = "0.10"
sha2 = "0.10"
sfumato-domain.workspace = true
slug = "0.1"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt"] }
