[package]
name = "sfumato-core"
version = "0.2.0"
edition = "2024"

[features]
real-renderers = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
dirs = "6.0"
json-patch = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sfumato-domain = { path = "../sfumato-domain" }
slug = "0.1"
thiserror = "2.0"
tokio = { version = "1.48", features = ["process"] }
toml = "0.9"
tempfile = "3.23"
walkdir = "2.5"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt"] }
