name: release

# The manual path: someone pushed a tag deliberately. `auto-release.yml` is the
# usual one and computes the tag from the commits; both end up in
# `release-artifacts.yml`, so a tag pushed by hand builds exactly what an automatic
# release would.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Prereleases keep the leading `v` and gain a suffix. They are invisible to
      # `releases/latest`, which is what makes them a safe rehearsal: install.sh
      # resolves the version from there, so a broken rc cannot reach anyone who
      # does not ask for it by name.
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify

      - name: the tag must match the workspace version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          cargo metadata --no-deps --format-version 1 --locked > /tmp/meta.json
          TAG="$tag" python3 .github/scripts/check_versions.py

      # A tag is cheap to move until an artifact exists, so the gate runs here
      # rather than trusting that CI passed on the commit.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  artifacts:
    needs: verify
    uses: ./.github/workflows/release-artifacts.yml
    with:
      tag: ${{ github.ref_name }}
