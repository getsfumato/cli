[package]
name = "sfumato"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/sfumato-core"]
resolver = "2"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
inquire = "0.7"
serde_json = "1.0"
sfumato-core = { path = "crates/sfumato-core" }
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread"] }
toml = "0.9"

[dev-dependencies]
